<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1b1e" />
    <title>Offline Puzzles</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="stylesheet" href="pieces.css" />
    <style>
      :root {
        --bg: #1a1b1e;
        --panel: #25262b;
        --text: #e9ecef;
        --dim: #909296;
        --accent: #4dabf7;
        --ok: #40c057;
        --bad: #fa5252;
        --light: #e8d6b0;
        --dark: #a77c56;
        --sel: #f7ec74;
        --last: rgba(155, 199, 0, 0.45);
        --hint: rgba(64, 192, 87, 0.6);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.4 system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      header h1 { font-size: 18px; margin: 0; flex: 1; }
      button {
        font: inherit;
        color: var(--text);
        background: #373a40;
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        min-height: 44px;
      }
      button.primary { background: var(--accent); color: #000; }
      button:disabled { opacity: 0.4; }
      main { padding: 16px; max-width: 900px; margin: 0 auto; }
      .muted { color: var(--dim); font-size: 14px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 8px;
        margin-top: 12px;
      }
      .tile {
        background: var(--panel);
        border-radius: 8px;
        padding: 10px;
        text-align: left;
        min-height: 64px;
        border: 2px solid transparent;
      }
      .tile.solved { border-color: var(--ok); }
      .tile.failed { border-color: var(--bad); }
      .tile .n { font-weight: 700; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
      .board-wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
      .board {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        width: min(92vw, 560px, 70vh);
        aspect-ratio: 1;
        border-radius: 4px;
        overflow: hidden;
        user-select: none;
      }
      .sq {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: min(9.5vw, 60px, 7.5vh);
        line-height: 1;
      }
      .sq.l { background: var(--light); }
      .sq.d { background: var(--dark); }
      .sq.last::after, .sq.sel::after, .sq.hint::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .sq.last::after { background: var(--last); }
      .sq.hint::after { background: var(--hint); }
      .sq.sel::after { background: var(--sel); opacity: 0.6; }
      .pc {
        position: relative;
        z-index: 1;
        pointer-events: none;
        width: 100%;
        height: 100%;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
      }
      .coord {
        position: absolute;
        font-size: 11px;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.55);
        z-index: 1;
      }
      .coord.f { right: 3px; bottom: 1px; }
      .coord.r { left: 3px; top: 1px; }
      .side { flex: 1; min-width: 240px; }
      .setup { font-family: ui-monospace, monospace; font-size: 15px; white-space: pre-wrap; }
      .status { font-size: 20px; font-weight: 700; margin: 8px 0; }
      .status.ok { color: var(--ok); }
      .status.bad { color: var(--bad); }
      .promo {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        gap: 12px;
        z-index: 5;
      }
      .promo.show { display: flex; }
      .promo button { width: 80px; height: 80px; padding: 6px; display: flex; }
      .badge { display: inline-block; background: #373a40; border-radius: 6px; padding: 2px 8px; margin: 2px; font-size: 13px; }
      a { color: var(--accent); }
      .chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
      .radar { max-width: 420px; margin: 0 auto; }
      .chart-box { position: relative; }
      .tip { position: absolute; width: 160px; background: var(--panel); border: 1px solid #3a3b40; border-radius: 6px; padding: 6px 8px; font-size: 13px; pointer-events: none; }
      .tiles { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
      .kpi { background: var(--panel); border-radius: 8px; padding: 8px 12px; flex: 1; min-width: 90px; }
      .kpi b { font-size: 24px; }
      .seg { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; margin: 8px 0; }
      .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--dim); margin: 4px 0; }
      .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
      h2 { font-size: 17px; margin: 22px 0 6px; }
      details { margin: 6px 0; color: var(--dim); }
      table { border-collapse: collapse; font-size: 13px; color: var(--text); }
      td, th { padding: 3px 8px; text-align: left; }
      .theme-select { background: var(--panel); color: var(--text); border: 1px solid #3a3b40; border-radius: 8px; padding: 10px; font-size: 16px; }
    </style>
  </head>
  <body>
    <header>
      <button id="back" hidden aria-label="Back to list">←</button>
      <h1 id="title">Offline Puzzles</h1>
      <span id="net" class="muted"></span>
    </header>
    <main id="main"></main>
    <div class="promo" id="promo"></div>
    <script src="app.js"></script>
  </body>
</html>
